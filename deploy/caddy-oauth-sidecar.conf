# OAuth routing — SIDECAR backend (FEATHERREADER_REPO_BACKEND=sidecar).
#
# Selected by container-entrypoint.sh and imported by the Caddyfile. The
# matching file for the other backend is caddy-oauth-rust.conf; exactly one is
# ever installed as /etc/caddy/oauth-routes.conf.
#
# This is the routing that has always been in force: the sidecar owns the public
# OAuth surface at its root (/login, /callback, /client-metadata.json,
# /jwks.json), reached under /oauth/* with the prefix stripped.
#
# COLLISION: the sidecar's atproto redirect_uri and the Rust app's post-login
# callback are both the literal path /oauth/callback. They are disambiguated by
# query parameter (grounded in oauth-sidecar/src/server.ts):
#   - PDS  -> SIDECAR (/callback):  code=&state=  (success)  OR  error=&state=
#     (user denied). NEITHER carries session_id or error_description.
#   - SIDECAR -> RUST APP:  ?session_id=<id> on success (server.ts:196), or
#     ?error=OAuthCallbackFailed&error_description=<msg> on the sidecar's own
#     failure hand-off (server.ts:200-204).
# So /oauth/callback goes to the APP when it carries session_id OR
# error_description, and everything else falls through to the sidecar.

@app_callback_ok {
	path /oauth/callback
	query session_id=*
}
handle @app_callback_ok {
	reverse_proxy 127.0.0.1:8082
}

@app_callback_err {
	path /oauth/callback
	query error_description=*
}
handle @app_callback_err {
	reverse_proxy 127.0.0.1:8082
}

# Everything else under /oauth/* is the sidecar's, prefix stripped:
#   /oauth/client-metadata.json -> /client-metadata.json
#   /oauth/callback?code=...    -> /callback   (PDS success)
#   /oauth/callback?error=...   -> /callback   (PDS deny)
#   /oauth/login, /oauth/jwks.json, ...
handle_path /oauth/* {
	reverse_proxy 127.0.0.1:8081
}
