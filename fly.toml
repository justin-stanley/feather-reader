# fly.toml — FeatherReader (feather-reader.com)
#
# Single always-on machine. The background feed poller + read-state flusher
# (src/scheduler.rs) run in-process and cannot scale to zero, so the machine is
# pinned running. Cloudflare (Full-strict) fronts Fly; Fly still forces HTTPS.
#
# One 1GB volume at /data holds ALL persistent state:
#   * FEATHERREADER_DB   (/data/featherreader.db)  — the SQLite cache, including
#     the OAuth sessions (`oauth_session`)
#   * FEATHERREADER_OAUTH_KEY_PATH (/data/oauth-signing-key.json) — the OAuth
#     client's signing key
#   * Caddy's state (/data/caddy)
# Left behind by the Node sidecar, removed in 0.5.0 (#311), and read by nothing:
# /data/oauth-sidecar.db and /data/oauth-sidecar.db.jwk.json. Delete them once
# a rollback to 0.4.x is no longer wanted (see deploy/teardown.md).
# The container entrypoint chowns /data to the app uid on first boot (a fresh Fly
# volume is root:root), so the non-root app can create these files.
#
# ONE-TIME MAINTENANCE — auto_vacuum (databases created before v0.3.0 only):
#   fly ssh console -C "/app/featherreader --migrate-auto-vacuum"
# Databases created from v0.3.0 on are already in INCREMENTAL mode. Older ones
# are in SQLite's default NONE, where reclaiming freed pages requires a FULL
# VACUUM — which writes a second complete copy of the database and so needs free
# disk roughly equal to the live file. That is exactly what is missing under the
# disk pressure that triggers a retention sweep, so the app now refuses to run
# one on its own and logs a warning instead. Switching modes needs that same full
# VACUUM, so it is this deliberate, operator-timed step: run it while the volume
# has headroom (it refuses itself if not). Safe to run blindly — it exits 0 doing
# nothing if already migrated.
#
# RUN IT WITH THE APP STOPPED. The VACUUM holds an exclusive lock for minutes on
# a large database, and the app's busy_timeout is 5 s — so writes do not queue,
# they FAIL: mark-read and star return errors, and OAuth session writes fail, so
# LOGINS BREAK for the duration. /health keeps returning 200 throughout, because
# its probe is a read. Also note this command runs as root and applies the
# binary's schema migrations before the VACUUM, so use the SAME image version
# that is currently deployed.
#
# DEPLOY BY DIGEST (not by tag). The release workflow publishes signed provenance
# bound to the image DIGEST; deploying a mutable tag (or :latest) can silently
# roll prod backward or bypass the attestation. The runbook resolves the tag to a
# digest, runs `gh attestation verify oci://...@<digest>` (fail-closed), then
# `fly deploy -i ghcr.io/justin-stanley/feather-reader@<digest>`. See [build] below.
#
# REQUIRED SECRETS (set once, NEVER in this file or the image):
#   fly secrets set \
#     FEATHERREADER_COOKIE_SECRET="$(openssl rand -base64 48)" \
#     FEATHERREADER_OAUTH_ENCRYPTION_KEY="$(openssl rand -base64 32)" \
#     FEATHERREADER_PUBLIC_URL="https://feather-reader.com" \
#     FEATHERREADER_ALLOWED_DIDS="did:plc:..."
# Without FEATHERREADER_OAUTH_ENCRYPTION_KEY, config.rs::validate_secrets()
# REFUSES TO BOOT: `oauth_session` holds every user's access token, refresh token
# and DPoP private key, and without it the codec is a no-op and all three sit in
# plaintext in SQLite on the same volume (and in every snapshot of it) as the
# feed cache. Rotating it strands existing sessions: the old ciphertext will not
# decrypt, and every reader must log in again.
#
# THE SIDECAR'S SECRETS ARE ROLLBACK STATE, NOT CONFIG (0.5.0, #311). 0.5.0
# reads no SIDECAR_* and warns at boot while any is set. But 0.4.x on the rust
# backend still REFUSES TO BOOT in production without a strong
# SIDECAR_INTERNAL_SECRET, so unsetting it before you are done with the option
# of rolling back would turn a rollback into a boot loop. Once it is no longer
# wanted: `fly secrets unset SIDECAR_INTERNAL_SECRET SIDECAR_ENC_KEY
# SIDECAR_PUBLIC_URL SIDECAR_APP_CALLBACK_URL`.
#
# OPTIONAL SECRET — only if running the follow→invite bot (POST /bot/claims):
#   fly secrets set FEATHERREADER_BOT_SECRET="$(openssl rand -base64 48)"
# Unset ⇒ /bot/claims returns 503 (endpoint disabled). If set on this (public)
# instance it must be strong (>= 32 bytes, not a dev default) or boot fails. The
# bot host must be given the SAME value (see bot/README.md). Optionally also
#   FEATHERREADER_CLAIM_TTL_SECS   (default 1209600 = 14 days)
# config.rs::validate_secrets() FAILS LOUD at boot if the cookie or encryption
# secret is missing or weak on this (public) instance.
#
# THE BACKEND. The Node sidecar served the OAuth flow and repo calls until the
# 2026-09-13 cutover to rust, and 0.5.0 removed it (#311). Its history (the
# cutover, why it logged everyone out) is in CHANGELOG.md and the deploy runbook.

app = "featherreader"
primary_region = "ord"

# How long Fly waits after SIGTERM before SIGKILL. The default is 5 s, which is
# shorter than a single poll round can take to even LAUNCH: a full batch is 50
# feeds at a 250 ms stagger (12.5 s), and each feed is leased an hour forward
# BEFORE its fetch so a crash cannot re-select it first. SIGKILL rolls no lease
# back, so a deploy landing mid-round used to push up to 50 feeds an hour out —
# invisible, because /stats cannot show a feed as overdue when next_poll was
# moved forward. The poller now also stops launching new feeds the moment
# shutdown is signalled; this is the other half, so the ones already in flight
# can finish and the flusher can make its final read-state push.
kill_timeout = "45s"

[build]
  # Image is built + pushed by .github/workflows/release-image.yml to GHCR with
  # SLSA build-provenance (and optional SBOM) attestations bound to the DIGEST.
  # This tag is a convenience default ONLY; production deploys resolve to and
  # deploy the immutable DIGEST after `gh attestation verify` (see header + the
  # deploy runbook). GHCR package visibility must be public OR Fly must hold GHCR
  # pull creds (see MANUAL STEPS) or the pull will fail.
  image = "ghcr.io/justin-stanley/feather-reader:latest"

[env]
  # Non-secret runtime wiring. In-container ports: Caddy 8080 (public), Rust app
  # 127.0.0.1:8082.
  FEATHERREADER_BIND = "127.0.0.1:8082"
  FEATHERREADER_DB = "/data/featherreader.db"
  FEATHERREADER_ENV = "prod"
  # Rust is the only backend since 0.5.0 (#311), which accepts this and changes
  # nothing. KEPT FOR ROLLBACK: a rollback deploys an older image with THIS
  # file, and on 0.4.x an unset variable means the removed sidecar, so dropping
  # the line would make a rollback to 0.4.x sign everyone out and break login.
  FEATHERREADER_REPO_BACKEND = "rust"
  # standard.site publications may be STORED: pasted into the subscribe form, or
  # imported. Stored ones are polled either way; this gates storage, not reading.
  FEATHERREADER_STANDARD_SITE = "true"
  # Cloudflare fronts Fly, so the real client IP is CF-Connecting-IP. This is
  # authoritative ONLY if the origin is locked to Cloudflare (see Caddyfile note
  # + MANUAL STEP: CF-only origin allowlist).
  FEATHERREADER_TRUSTED_IP_HEADER = "cf-connecting-ip"
  # Keep the poller from filling a 1GB volume: pause new fetches below the volume
  # size (see the startup watermark-vs-disk check in src/main.rs).
  FEATHERREADER_DB_SIZE_WATERMARK_BYTES = "805306368"  # 768 MiB (< 1GB volume)
  # No SIDECAR_* here since 0.5.0 (#311): nothing reads them, and the app warns
  # at boot while one is set. A rollback to 0.4.x does not need them from this
  # file: those images bake their own loopback SIDECAR_* defaults.
  RUST_LOG = "info"
  # Background loops wait 30/45/60/75/90 s (and the relay probe 5 min) before their
  # FIRST tick, so a crash-looping machine does not re-run every sweep on every
  # restart. FEATHERREADER_STARTUP_DELAY_SECS shortens them for a dev or
  # integration run — it is a CEILING, so setting it HIGHER changes nothing and
  # logs that it was ignored. Not set here: production wants the built-in values.

[[mounts]]
  source = "featherreader_data"
  destination = "/data"

[http_service]
  internal_port = 8080          # Caddy — the only off-loopback listener
  force_https = true
  auto_stop_machines = "off"    # the poller cannot scale to zero
  # TRUE, deliberately, even though auto_stop is off. These two are independent:
  # auto_stop=off only means the proxy never STOPS a machine, and a machine can
  # still end up stopped by the restart policy giving up. The default `on-fail`
  # policy retries a non-zero exit up to `max_retries` times (default 10) in 5
  # minutes and then leaves
  # the machine STOPPED — and with auto_start=false the proxy will not start it
  # again, so an OOM crash loop (realistic on 512 MB) ends in a permanent outage
  # needing a manual `fly machine start`. With auto_start=true a request brings it
  # back.
  #
  # IT IS NOT FREE, and an earlier version of this comment claimed it was. The
  # proxy wakes the machine BEFORE any in-container routing, so the Caddy origin
  # lock cannot gate the wake: anyone who can reach featherreader.fly.dev can now
  # force a start, even though Caddy will then 403 them. More importantly that
  # turns the `on-fail` retry cap from a circuit breaker into a formality — a
  # crash loop restarts at request rate indefinitely, reopening the SQLite WAL
  # each time, which is least welcome in the crash-during-write case.
  #
  # Taken anyway: on ONE machine with no on-call, a permanent stop that only a
  # human can clear is worse than a loop that at least self-heals when the cause
  # is transient — and the poller lease (T2.1) already removed the crash-loop
  # cause this project actually hit. Revisit if a second machine ever exists.
  auto_start_machines = true
  # Inert with auto_stop_machines="off" — it only applies when that is "stop" or
  # "suspend". Kept as documentation of intent, not as a safety net; it is not
  # one.
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  # Liveness. /health reads one row from a real table (`SELECT 1 FROM feeds
  # LIMIT 1`) under a 2 s timeout — inside the 3 s below, so a wedged pool yields
  # a 503 the app chose, with a reason, rather than a timeout Fly inferred. It
  # reads a real page deliberately: a bare `SELECT 1` emits no OpenRead opcode at
  # all, so it returns success against a corrupted database. CONCURRENT probes are
  # deduplicated — at most one is ever in flight, others reuse its predecessor's
  # verdict — so /health, which is origin-lock-exempt and unauthenticated, cannot
  # be used to spend the 5-connection pool. (There is no TIME cache: every
  # sequential request, including Fly's own, gets a fresh answer.) Only the
  # database can fail this check:
  # the body also reports uptime, the
  # poll heartbeat, whether fetching is paused at the size watermark, and the
  # live OAuth backend, but none of those affect the status code.
  #
  # WHAT A FAILED CHECK ACTUALLY DOES — this comment used to say "Fly restarts on
  # a failed check", which is FALSE. Fly's docs are explicit (health-checks
  # reference, stated and then restated on that page): a failing service check
  # does NOT restart or stop a Machine. Fly Proxy stops ROUTING to
  # it, and re-registers automatically once the check passes. (That capability
  # existed on Apps V1 as `restart_limit`; it has no successor on Machines.)
  #
  # MEASURED on a throwaway app mirroring this config exactly — one machine,
  # auto_stop off, same 15s/3s/10s check — by failing /health for 120 s:
  #
  #   t=  0s  200   0.21s     healthy
  #   t=  2s  503  39.83s  <-- the edge HANGS ~40 s, THEN 503s
  #   t= 44s  503  39.56s
  #   t= 85s  503  39.67s
  #   t=127s  200   0.30s     re-registered ~7 s after health returned
  #
  # Machine event log afterwards: `launch` and `start`, both at creation. No
  # restart, no stop — the docs' claim holds, now verified rather than read.
  #
  # **The ~40 s is the part worth designing around, and it is undocumented.** A
  # failed check does not fail requests fast; it makes every request hang for
  # about forty seconds first. Browsers sit spinning, clients hit their own
  # timeouts, and connections pile up against the 250 hard_limit for the whole
  # outage. That is materially worse than an immediate 503 and it is the real
  # argument for keeping this check NARROW: anything that can flap here converts
  # a brief internal blip into forty-second hangs for every visitor. It is also
  # why /health's DB probe uses a 2 s timeout inside this 3 s one — the app must
  # answer with a reason before Fly infers a failure and the hang begins.
  #
  # With ONE machine there is no healthy peer to shift to, so a 503 here is not a
  # failover — it is a total outage lasting exactly as long as the condition. It
  # ALSO fails a `fly deploy`: the rolling strategy waits for the new machine to
  # go healthy and there is no auto-rollback, so a database blip during a release
  # leaves a stuck, empty app. Both are reasons to keep this check narrow.
  #
  # So the question the status code answers is "can this process serve a useful
  # request at all", NOT "would a restart help". A stale poller can serve; a
  # database it cannot read cannot.
  #
  # ALERT ON THE BODY for everything else. The first token is the state and is
  # the thing to match: `ok` (probed, healthy), `unknown` (no probe has completed
  # yet — brief, at boot only) or `FAIL` (probed, broken). Matching `^ok` alone
  # is not the same as "healthy".
  # Reached through Caddy, so this also proves the edge + app path is up.
  [[http_service.checks]]
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1

