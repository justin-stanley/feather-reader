# cargo-audit configuration (read by `cargo audit`, which CI runs with
# `-D warnings`). Mirrors the `[advisories] ignore` list in deny.toml: keep the
# two in step, keep both SHORT, and revisit on every Dependabot bump.

[advisories]
ignore = [
    # RUSTSEC-2026-0374: basic-toml is unmaintained. Pulled in only by
    # askama_derive (via askama_macros, a proc-macro), which uses it at COMPILE
    # time to read this repo's own askama.toml. It never runs in the server and
    # never sees untrusted input; "unmaintained", not a vulnerability. askama
    # 0.16.1 is the newest release and still depends on it, so there is no
    # upgrade to take. Drop this when askama moves off basic-toml.
    # https://rustsec.org/advisories/RUSTSEC-2026-0374
    "RUSTSEC-2026-0374",
]
