name: CodeQL

# GitHub's semantic code-scanning (SAST). Results land in the Security tab.
#
# ── RUNNER / COST TRADEOFF ────────────────────────────────────────────────────
# CodeQL is DESIGNED FOR GITHUB-HOSTED runners (the Actions bundle ships the
# CodeQL CLI + query packs; the self-hosted CI VM does not). So this workflow
# uses `ubuntu-latest`, NOT the self-hosted runner.
#
# The repo is public, so GitHub-hosted Actions + code scanning are free, and it
# runs on every PR to `main` (per-PR SAST), on push to `main`, and on a weekly
# schedule. See .github/workflows/README.md.
#
# ── LANGUAGES ─────────────────────────────────────────────────────────────────
#   * rust — the only leg since 0.5.0 removed the Node sidecar (#311), whose
#     javascript-typescript leg went with it. Re-added 2026-10-18 (#313): it had
#     been dropped when the extractor (then in beta) errored on every source
#     file (0 OK / 11 with errors). On CodeQL 2.27.2 all 47 files extract
#     without error, the security-and-quality suite runs 30 Rust rules, about
#     5.5 min per run. Clippy (-D warnings), cargo-deny and cargo-audit still
#     run in CI.

# ── TRIGGERS / SCORECARD SAST COVERAGE ────────────────────────────────────────
# Runs on EVERY pull_request targeting `main` (so every merged PR carries a
# CodeQL check-run), on push to `main`, on a weekly deep scan, and manually.
#
# Do NOT add a `paths:`/`paths-ignore:` filter here. OSSF Scorecard's SAST check
# samples recent merged PRs and expects a CodeQL check-run on each — including
# config-only PRs (e.g. a lone Cargo.toml / *.yml change). A path filter would
# skip those, drop the check-run, and regress the Scorecard SAST score. The
# rust leg (~5.5 min) always produces the run.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 4 * * 1"  # Mondays 04:27 UTC — weekly deep scan
  workflow_dispatch:

# Least-privilege default for the workflow; the analyze job grants itself the
# security-events: write it needs to upload SARIF.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    # Code scanning needs GitHub Advanced Security on a PRIVATE repo (e.g. a
    # private fork), where the SARIF upload would fail, so it is skipped there.
    # This repo is public, so it always runs here.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-latest  # GitHub-hosted: free for this public repo; see header note
    permissions:
      actions: read
      contents: read
      security-events: write  # upload SARIF to the Security tab
    strategy:
      fail-fast: false
      matrix:
        language: [rust]  # see header
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          # `security-and-quality` = the broader query suite (security + code
          # quality), a good default for a new OSS project.
          queries: security-and-quality

      # Rust is no-build (CodeQL extracts from source; build-mode none on 2.27.2). If the Rust extractor ever needs a real build, replace this
      # with an explicit `cargo build` step guarded on matrix.language == rust.
      - name: Autobuild
        uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: "/language:${{ matrix.language }}"
