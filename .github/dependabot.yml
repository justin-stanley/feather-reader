# Dependabot — automated dependency-update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Weekly cadence, minor+patch grouped into a single PR per ecosystem to cut PR
# noise (majors stay separate so breaking bumps get individual review).
version: 2
updates:
  # --- Rust (root Cargo.toml / Cargo.lock) ---------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # --- GitHub Actions (workflow `uses:` pins) ------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # --- Docker ---------------------------------------------------------------
  # Base images (rust, caddy, debian) in the app's Dockerfile and bench/'s, all
  # pinned as `name:<version>@sha256:<index digest>`. Dependabot bumps the tag
  # and digest together. Enabled 2026-10-25: by hand they had drifted five Rust
  # releases behind. ci.yml's Caddyfile job reads the caddy pin out of the
  # Dockerfile, so a caddy bump is validated against the new version.
  # Debian release moves (bookworm -> trixie) are not version bumps and stay
  # manual: the builder and runtime must move together.
  - package-ecosystem: docker
    directories: ["/", "/bench"]
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(docker)"
    groups:
      docker-minor-patch:
        update-types: [minor, patch]
