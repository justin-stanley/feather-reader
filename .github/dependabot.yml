# Dependabot — automated dependency-update PRs.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
#
# Weekly cadence, minor+patch grouped into a single PR per ecosystem to cut PR
# noise (majors stay separate so breaking bumps get individual review).
version: 2
updates:
  # --- Rust (root Cargo.toml / Cargo.lock) ---------------------------------
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(cargo)"
    groups:
      cargo-minor-patch:
        update-types: [minor, patch]

  # --- OAuth sidecar (Node/npm) --------------------------------------------
  - package-ecosystem: npm
    directory: "/oauth-sidecar"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(npm)"
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  # --- GitHub Actions (workflow `uses:` pins) ------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps(actions)"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  # --- Docker ---------------------------------------------------------------
  # NOT ENABLED. The Dockerfile is at the repo root (directory "/"), and its
  # base images (rust, node, caddy) are pinned by digest and bumped by hand;
  # ci.yml's Caddyfile job validates against the caddy digest the Dockerfile
  # pins. Left in as a placeholder so the wiring is one uncomment away.
